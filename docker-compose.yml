name: zerotrace

services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      API_PORT: 8080
      CORS_ORIGIN: http://localhost:${WEB_PORT:-5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-8000}
      HEALTH_CACHE_TTL_MS: ${HEALTH_CACHE_TTL_MS:-15000}
      PROVIDER_ALLOW_HOSTS: ${PROVIDER_ALLOW_HOSTS:-eth-mainnet.g.alchemy.com,bsc-dataseed.bnbchain.org,bsc-dataseed-public.bnbchain.org,portal.sqd.dev,api.mainnet.solana.com,blockstream.info}
      ALLOW_PRIVATE_PROVIDER_URLS: ${ALLOW_PRIVATE_PROVIDER_URLS:-false}
      PROVIDER_MAX_ATTEMPTS: ${PROVIDER_MAX_ATTEMPTS:-3}
      PROVIDER_RETRY_BASE_MS: ${PROVIDER_RETRY_BASE_MS:-100}
      PROVIDER_RETRY_MAX_MS: ${PROVIDER_RETRY_MAX_MS:-2000}
      PROVIDER_CIRCUIT_FAILURE_THRESHOLD: ${PROVIDER_CIRCUIT_FAILURE_THRESHOLD:-5}
      PROVIDER_CIRCUIT_RESET_MS: ${PROVIDER_CIRCUIT_RESET_MS:-30000}
      PROVIDER_CACHE_TTL_MS: ${PROVIDER_CACHE_TTL_MS:-1000}
      PROVIDER_CACHE_MAX_ENTRIES: ${PROVIDER_CACHE_MAX_ENTRIES:-500}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      ETH_RPC_URL: ${ETH_RPC_URL:-}
      EVM_ETHEREUM_RPC_URL: ${EVM_ETHEREUM_RPC_URL:-}
      EVM_ETHEREUM_RPC_URLS: ${EVM_ETHEREUM_RPC_URLS:-}
      EVM_ETHEREUM_CHAIN_ID: ${EVM_ETHEREUM_CHAIN_ID:-1}
      EVM_ETHEREUM_SNAPSHOT_TAG: ${EVM_ETHEREUM_SNAPSHOT_TAG:-finalized}
      EVM_ETHEREUM_REQUESTS_PER_SECOND: ${EVM_ETHEREUM_REQUESTS_PER_SECOND:-5}
      BSC_RPC_URL: ${BSC_RPC_URL:-}
      EVM_BSC_RPC_URL: ${EVM_BSC_RPC_URL:-}
      EVM_BSC_RPC_URLS: ${EVM_BSC_RPC_URLS:-https://bsc-dataseed.bnbchain.org,https://bsc-dataseed-public.bnbchain.org}
      EVM_BSC_CHAIN_ID: ${EVM_BSC_CHAIN_ID:-56}
      EVM_BSC_SNAPSHOT_TAG: ${EVM_BSC_SNAPSHOT_TAG:-finalized}
      EVM_BSC_REQUESTS_PER_SECOND: ${EVM_BSC_REQUESTS_PER_SECOND:-10}
      BTC_ESPLORA_URL: ${BTC_ESPLORA_URL:-}
      BITCOIN_ESPLORA_URL: ${BITCOIN_ESPLORA_URL:-}
      BITCOIN_ESPLORA_URLS: ${BITCOIN_ESPLORA_URLS:-https://blockstream.info/api}
      BITCOIN_ESPLORA_REQUESTS_PER_SECOND: ${BITCOIN_ESPLORA_REQUESTS_PER_SECOND:-2}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet.solana.com}
      SOLANA_RPC_URLS: ${SOLANA_RPC_URLS:-}
      SOLANA_REQUESTS_PER_SECOND: ${SOLANA_REQUESTS_PER_SECOND:-4}
      SOLANA_COMMITMENT: ${SOLANA_COMMITMENT:-finalized}
      SQD_PORTAL_URL: ${SQD_PORTAL_URL:-https://portal.sqd.dev}
      POSTGRES_URL: postgresql://zerotrace:${POSTGRES_PASSWORD:-zerotrace}@postgres:5432/zerotrace
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      VALKEY_URL: redis://valkey:6379
      NATS_URL: nats://nats:4222
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-zerotrace}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-change-me-in-non-local-environments}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-zerotrace-raw}
      GMGN_API_KEY: ${GMGN_API_KEY:-}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      DUNE_API_KEY: ${DUNE_API_KEY:-}
      NANSEN_API_KEY: ${NANSEN_API_KEY:-}
      ARKHAM_API_KEY: ${ARKHAM_API_KEY:-}
    ports:
      - '${API_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks: [zerotrace]

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-5173}:80'
    depends_on:
      api:
        condition: service_healthy
    networks: [zerotrace]

  ingest-worker:
    profiles: [ingest]
    build:
      context: .
      target: ingest-worker
    environment:
      SQD_PORTAL_URL: ${SQD_PORTAL_URL:-https://portal.sqd.dev}
      SQD_REQUESTS_PER_SECOND: ${SQD_REQUESTS_PER_SECOND:-2}
      SQD_MAX_RANGE_BLOCKS: ${SQD_MAX_RANGE_BLOCKS:-50000}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
      SQD_PROVIDER_ALLOW_HOSTS: ${SQD_PROVIDER_ALLOW_HOSTS:-portal.sqd.dev}
      ALLOW_PRIVATE_PROVIDER_URLS: ${ALLOW_PRIVATE_PROVIDER_URLS:-false}
      PROVIDER_MAX_ATTEMPTS: ${PROVIDER_MAX_ATTEMPTS:-3}
      PROVIDER_RETRY_BASE_MS: ${PROVIDER_RETRY_BASE_MS:-250}
      PROVIDER_RETRY_MAX_MS: ${PROVIDER_RETRY_MAX_MS:-10000}
      POSTGRES_URL: postgresql://zerotrace:${POSTGRES_PASSWORD:-zerotrace}@postgres:5432/zerotrace
      CLICKHOUSE_URL: http://clickhouse:8123
      OBJECT_STORE_ENDPOINT: http://minio:9000
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-zerotrace}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-change-me-in-non-local-environments}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-zerotrace-raw}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [zerotrace]

  postgres:
    image: zerotrace-postgres:17.10
    build:
      context: .
      target: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zerotrace
      POSTGRES_USER: zerotrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zerotrace}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zerotrace -d zerotrace']
      interval: 5s
      timeout: 4s
      retries: 20
    networks: [zerotrace]

  clickhouse:
    image: zerotrace-clickhouse:26.7.3.19
    build:
      context: .
      target: clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: zerotrace
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
      - '${CLICKHOUSE_HTTP_PORT:-8123}:8123'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8123/ping | grep -q Ok']
      interval: 5s
      timeout: 4s
      retries: 20
    networks: [zerotrace]

  valkey:
    image: valkey/valkey:8.1.9-alpine
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - '${VALKEY_PORT:-6379}:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 4s
      retries: 20
    networks: [zerotrace]

  nats:
    image: nats:2.11.17-alpine
    restart: unless-stopped
    command: ['--jetstream', '--store_dir=/data', '--http_port=8222']
    ports:
      - '${NATS_PORT:-4222}:4222'
      - '${NATS_MONITOR_PORT:-8222}:8222'
    volumes:
      - nats-data:/data
    networks: [zerotrace]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY:-zerotrace}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_KEY:-change-me-in-non-local-environments}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null']
      interval: 5s
      timeout: 4s
      retries: 20
    networks: [zerotrace]

  temporal:
    image: temporalio/auto-setup:1.29.7
    profiles: [full]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: zerotrace
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-zerotrace}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${TEMPORAL_PORT:-7233}:7233'
    networks: [zerotrace]

  temporal-ui:
    image: temporalio/ui:2.53.1
    profiles: [full]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${WEB_PORT:-5173}
    depends_on: [temporal]
    ports:
      - '${TEMPORAL_UI_PORT:-8233}:8080'
    networks: [zerotrace]

  graph-db:
    image: apache/age:release_PG18_1.7.0
    profiles: [graph]
    environment:
      POSTGRES_DB: zerotrace_graph
      POSTGRES_USER: zerotrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zerotrace}
    ports:
      - '${AGE_PORT:-5455}:5432'
    volumes:
      - age-data:/var/lib/postgresql
    networks: [zerotrace]

networks:
  zerotrace:
    driver: bridge

volumes:
  postgres-data:
  clickhouse-data:
  valkey-data:
  nats-data:
  minio-data:
  age-data:
