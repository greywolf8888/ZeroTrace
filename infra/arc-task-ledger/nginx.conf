server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
  location /api/ { proxy_pass http://api:8087/; proxy_read_timeout 15s; }
  location / { try_files $uri $uri/ /index.html; }
}
