name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: zerotrace-ci
      POSTGRES_PORT: 55432
      CLICKHOUSE_HTTP_PORT: 58123
      MINIO_PORT: 59000
      MINIO_CONSOLE_PORT: 59001
      OBJECT_STORE_ACCESS_KEY: zerotrace-ci
      OBJECT_STORE_SECRET_KEY: zerotrace-ci-secret-change-me
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Start disposable durable stores
        run: |
          docker compose -p zerotrace-ci up -d --build postgres clickhouse minio
          timeout 90 bash -c 'until docker compose -p zerotrace-ci exec -T postgres pg_isready -U zerotrace -d zerotrace; do sleep 2; done'
          timeout 90 bash -c 'until curl -fsS http://127.0.0.1:58123/ping | grep -q Ok; do sleep 2; done'
          timeout 90 bash -c 'until curl -fsS http://127.0.0.1:59000/minio/health/live >/dev/null; do sleep 2; done'

      - name: Unit and integration coverage
        run: npm run test:coverage
        env:
          TEST_POSTGRES_URL: postgresql://zerotrace:zerotrace-ci@127.0.0.1:55432/zerotrace
          TEST_CLICKHOUSE_URL: http://127.0.0.1:58123
          TEST_OBJECT_STORE_ENDPOINT: http://127.0.0.1:59000
          TEST_OBJECT_STORE_ACCESS_KEY: zerotrace-ci
          TEST_OBJECT_STORE_SECRET_KEY: zerotrace-ci-secret-change-me

      - name: Production build
        run: npm run build

      - name: Check production licenses
        run: npm run license:check

      - name: Audit dependency graph
        run: npm run audit

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p reports
          npm run sbom

      - name: Stop disposable durable stores
        if: always()
        run: docker compose -p zerotrace-ci down --volumes

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-evidence
          if-no-files-found: warn
          path: |
            coverage/
            reports/sbom.cdx.json
          retention-days: 14

  e2e:
    name: Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and test UI
        run: npm run test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-evidence
          if-no-files-found: ignore
          path: output/playwright/
          retention-days: 14

  containers:
    name: Production container targets
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build ingestion worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: ingest-worker
          push: false
          cache-from: type=gha,scope=ingest-worker
          cache-to: type=gha,mode=max,scope=ingest-worker

      - name: Build semantic worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: semantic-worker
          push: false
          cache-from: type=gha,scope=semantic-worker
          cache-to: type=gha,mode=max,scope=semantic-worker

      - name: Build PostgreSQL initialization image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: postgres
          push: false
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres

      - name: Build ClickHouse initialization image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: clickhouse
          push: false
          cache-from: type=gha,scope=clickhouse
          cache-to: type=gha,mode=max,scope=clickhouse

  rust:
    name: Rust compute plane
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal -c rustfmt -c clippy && rustup default 1.97.1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace
