version: 2
# ZeroTrace keeps only main between delivery batches. Ecosystem metadata stays registered here,
# while automated update PR branches are disabled. Dependabot alerts and CI audits are reviewed,
# then dependency changes are applied through the single protected delivery branch.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 0
    groups:
      npm-weekly:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: Asia/Singapore
    open-pull-requests-limit: 0
    groups:
      docker-weekly:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      docker-security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 0
    groups:
      actions-weekly:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: ci
