name: Bug report
description: Report reproducible incorrect behavior or a safety/data-integrity defect.
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Do not submit vulnerabilities or secrets here. Use private vulnerability reporting.

  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: State what happened and why it is incorrect.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Include the correct Unknown/unavailable or evidence behavior when relevant.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands, request, ledger, and identifier. Remove all credentials.
      render: shell
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or full commit SHA
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - EVM
        - Bitcoin
        - Solana
        - Entity Resolution
        - Control Rights
        - Launchpad / Market
        - Realizable Value / Scenario
        - Evidence
        - API / UI
        - Infrastructure
    validations:
      required: true

  - type: textarea
    id: snapshot
    attributes:
      label: Snapshot and evidence
      description: Block hash/height/slot, finality, provider, evidence ID, and sanitized payload hash.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node/Docker versions, browser, and provider type.
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed API keys, private URLs, personal data, private keys, and seed phrases.
          required: true
